<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fargo United | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Fargo United Soccer Team</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="schedule.html">Schedule</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="contact">
      <h2>Contact Us</h2>

      <form id="contact-form" action="https://formspree.io/f/xgvkoznb" method="POST">
        <input type="text" name="name" placeholder="Your Name" required><br>
        <input type="email" name="email" placeholder="Your Email" required><br>
        <textarea name="message" placeholder="Your Message" rows="6" required></textarea><br>
        <button type="submit">Send Message</button>
      </form>

      <div id="confirmation-message" style="display: none;">
        <h3>Thank you! Your message has been sent.</h3>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Fargo United. All rights reserved.</p>
  </footer>

  <script>
    const form = document.getElementById("contact-form");
    const confirmation = document.getElementById("confirmation-message");

    form.addEventListener("submit", async function (e) {
      e.preventDefault(); // Prevent reload

      const formData = new FormData(form);

      const response = await fetch(form.action, {
        method: form.method,
        body: formData,
        headers: {
          'Accept': 'application/json'
        }
      });

      if (response.ok) {
        form.style.display = "none";
        confirmation.style.display = "block";
      } else {
        alert("There was a problem submitting your message. Please try again.");
      }
    });
  </script>
</body>
</html>
