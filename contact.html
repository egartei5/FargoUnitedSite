<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact the Fargo United soccer team.">
  <title>Fargo United | Contact</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .logo {
      width: 60px;
      height: auto;
      margin-right: 15px;
    }

    header {
      background-color: #003366;
      color: white;
      padding: 15px 20px;
    }

    .header-top {
      display: flex;
      align-items: center;
    }

    .header-top h1 {
      margin: 0;
      font-size: 24px;
    }

    nav {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      padding: 40px 20px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    form {
      text-align: center;
    }

    form input, form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    form button {
      background-color: #003366;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    form button:hover {
      background-color: #0059b3;
    }

    #confirmation-message {
      text-align: center;
      margin-top: 20px;
      color: green;
    }

    footer {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 20px 10px;
      margin-top: 40px;
    }

    .social a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    .social a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <img src="fargo-united-logo.png.jpeg" alt="Fargo United Logo" class="logo">
      <h1>Fargo United Soccer Team</h1>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="roster.html">Team</a>
      <a href="schedule.html">Schedule</a>
      <a href="gallery.html">Gallery</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="contact">
      <h2>Contact Us</h2>

      <form id="contact-form" action="https://formspree.io/f/xgvkoznb" method="POST">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <input type="tel" name="phone" placeholder="Your Phone Number (optional)">
        <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>

      <div id="confirmation-message" style="display: none;">
        <h3>Thank you! Your message has been sent.</h3>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Fargo United. All rights reserved.</p>
    <div class="social">
      <a href="https://instagram.com" target="_blank">Instagram</a> |
      <a href="https://youtube.com" target="_blank">YouTube</a> |
      <a href="https://tiktok.com" target="_blank">TikTok</a>
    </div>
  </footer>

  <script>
    const form = document.getElementById("contact-form");
    const confirmation = document.getElementById("confirmation-message");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(form);
      const response = await fetch(form.action, {
        method: form.method,
        body: formData,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        form.style.display = "none";
        confirmation.style.display = "block";
      } else {
        alert("Something went wrong. Please try again.");
      }
    });
  </script>
</body>
</html>
