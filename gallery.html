<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fargo United match highlight photos and team moments.">
  <title>Fargo United | Gallery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .logo {
      width: 60px;
      height: auto;
      margin-right: 15px;
    }

    header {
      background-color: #003366;
      color: white;
      padding: 15px 20px;
    }

    .header-top {
      display: flex;
      align-items: center;
    }

    .header-top h1 {
      margin: 0;
      font-size: 24px;
    }

    nav {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: white;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .gallery {
      padding: 40px 20px;
      text-align: center;
    }

    .gallery-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      padding-top: 20px;
    }

    .gallery-grid img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 768px) {
      .gallery-grid img {
        width: 90%;
      }
    }

    footer {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 20px 10px;
      margin-top: 40px;
    }

    .social a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    .social a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <img src="https://raw.githubusercontent.com/egartei5/FargoUnitedSite/main/fargo-united-logo.jpeg" alt="Fargo United Logo" class="logo">
      <h1>Fargo United Soccer Team</h1>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="roster.html">Team</a>
      <a href="schedule.html">Schedule</a>
      <a href="gallery.html">Gallery</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="gallery">
      <h2>Match Highlights</h2>
      <div class="gallery-grid">
        <img src="images/gallery1.jpg" alt="Match Day 1">
        <img src="images/gallery2.jpg" alt="Celebration Moment">
        <img src="images/gallery3.jpg" alt="Training Session">
        <img src="images/gallery4.jpg" alt="Goal Celebration">
        <img src="images/gallery5.jpg" alt="Team Photo">
        <img src="images/gallery6.jpg" alt="Fans Supporting">
        <!-- Add more images here -->
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Fargo United. All rights reserved.</p>
    <div class="social">
      <a href="https://instagram.com" target="_blank">Instagram</a> |
      <a href="https://youtube.com" target="_blank">YouTube</a> |
      <a href="https://tiktok.com" target="_blank">TikTok</a>
    </div>
  </footer>
</body>
</html>
