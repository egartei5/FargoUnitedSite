<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Welcome to the official Fargo United Soccer Team website."/>
  <title>Fargo United | Home</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #003366;
      color: white;
      padding: 15px 20px;
    }

    .header-container {
      display: flex;
      align-items: center;
    }

    .logo {
      width: 60px;
      height: auto;
      margin-right: 15px;
    }

    .site-title {
      font-size: 24px;
      font-weight: bold;
    }

    .nav-bar {
      text-align: center;
      margin-top: 15px;
    }

    .nav-bar a {
      margin: 0 15px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    .nav-bar a:hover {
      text-decoration: underline;
    }

    .hero {
      background-color: #cce6ff;
      padding: 60px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      color: #333;
    }

    footer {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 20px 10px;
      margin-top: 40px;
    }

    .social a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    .social a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <img src="fargo-united-logo.png.jpeg" alt="Fargo United Logo" class="logo" />

    </div>
    <div class="nav-bar">
      <a href="index.html">Home</a>
      <a href="roster.html">Team</a>

      <a href="contact.html">Contact</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h2>Welcome to Fargo United!</h2>
      <p>Building champions on and off the field. Explore our players, schedule, highlights, and more.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Fargo United. All rights reserved.</p>
    <div class="social">
      <a href="https://instagram.com" target="_blank">Instagram</a> |
